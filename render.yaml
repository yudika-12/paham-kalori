services:
  - type: web
    name: paham-kalori-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: npm ci --ignore-scripts && npm run generate -w backend
    startCommand: npm run start -w backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: paham-kalori
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm ci --ignore-scripts && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false